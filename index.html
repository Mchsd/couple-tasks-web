<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1035">
<title>我们的每日约定 💘</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💘</text></svg>">
<style>
:root{
  --bg1:#1a1035; --bg2:#2d1b4e; --bg3:#3a1f5c;
  --pink:#f7c8d8; --rose:#e8b4c8; --gold:#f5d9a8;
  --heart:#ff6b9d; --deep:#ff8fb3;
  --text:#fdf0f5; --dim:#c9a8c4; --faint:#8a6b9e;
  --card:rgba(255,255,255,.07); --card-bd:rgba(255,200,220,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;color:var(--text);min-height:100vh;
  overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom);
}
/* ── 星空背景 ── */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
.moon{position:fixed;top:6%;right:8%;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff8e1,#f5d9a8 60%,#e8c48a);
  box-shadow:0 0 60px 15px rgba(245,217,168,.25);z-index:0;pointer-events:none}
.moon::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 60% 55%,transparent 42%,rgba(200,170,120,.28) 43%,transparent 46%),
  radial-gradient(circle at 30% 70%,transparent 38%,rgba(200,170,120,.22) 39%,transparent 42%)}
/* ── 布局 ── */
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 16px 40px}
/* 头部: 双人剪影+名字 */
header{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 0 4px}
.couple{display:flex;align-items:flex-end;gap:-2px;position:relative}
.couple .head{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.head-a{background:linear-gradient(135deg,#ff9ab5,#ff6b9d);transform:translateX(4px);z-index:2}
.head-b{background:linear-gradient(135deg,#8fb3ff,#6b8bff);transform:translateX(-4px);z-index:1}
.couple .heart-mini{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:16px;animation:beat 1.6s ease-in-out infinite;z-index:3;filter:drop-shadow(0 0 6px rgba(255,107,157,.8))}
@keyframes beat{0%,100%{transform:translateX(-50%) scale(1)}25%{transform:translateX(-50%) scale(1.25)}40%{transform:translateX(-50%) scale(.95)}}
.names{text-align:center;margin-top:6px}
.names .n{font-size:15px;color:var(--dim);letter-spacing:1px}
.names .n b{color:var(--pink);font-weight:600}
.names .amp{color:var(--heart);margin:0 8px;font-size:16px}
.subtitle{text-align:center;font-size:12px;color:var(--faint);margin-top:2px;letter-spacing:2px}
/* 连续天数 */
.streak-row{display:flex;justify-content:center;align-items:center;gap:8px;margin:14px 0 4px}
.streak-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 18px;border-radius:999px;
  background:rgba(255,107,157,.12);border:1px solid rgba(255,107,157,.35);font-size:14px;color:var(--pink)}
.streak-badge .fire{animation:flame 1.8s ease-in-out infinite;display:inline-block}
@keyframes flame{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.2) rotate(-6deg)}}
.streak-badge b{font-size:18px;color:var(--gold)}
/* 今日任务卡 */
.day-label{text-align:center;font-size:12px;color:var(--faint);letter-spacing:4px;margin:18px 0 10px}
.task-card{position:relative;background:var(--card);border:1px solid var(--card-bd);border-radius:18px;
  padding:26px 22px 22px;backdrop-filter:blur(8px);box-shadow:0 8px 32px rgba(0,0,0,.25);
  transition:transform .2s}
.task-card.done{border-color:rgba(255,107,157,.5);background:rgba(255,107,157,.08);
  animation:cardDone .4s ease}
@keyframes cardDone{0%{transform:translateY(0)}30%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.task-card .tape{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:110px;height:24px;background:rgba(245,217,168,.55);border-radius:3px;
  box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:2}
.task-date{text-align:center;font-size:11px;color:var(--faint);letter-spacing:2px;margin-bottom:6px}
.task-text{font-size:21px;line-height:1.6;text-align:center;font-weight:600;letter-spacing:1px;
  word-break:break-word;padding:6px 0 2px}
.task-text.empty{color:var(--faint);font-weight:400;font-size:17px}
.setter-line{text-align:center;font-size:12px;color:var(--dim);margin-top:8px}
.setter-line .heart-s{color:var(--heart)}
/* 完成区 */
.check-zone{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.check-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 42px;border:none;border-radius:999px;
  font-size:17px;font-weight:600;color:#fff;cursor:pointer;letter-spacing:2px;
  background:linear-gradient(135deg,var(--heart),var(--deep));
  box-shadow:0 6px 24px rgba(255,107,157,.4);transition:all .25s ease}
.check-btn:active{transform:scale(.95)}
.check-btn:disabled{opacity:.6;cursor:default;transform:none}
.check-btn.done{background:linear-gradient(135deg,#7ec9a0,#4da87a);box-shadow:0 6px 24px rgba(90,180,130,.35);
  animation:btnPop .35s ease}
@keyframes btnPop{0%{transform:scale(.92)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
.check-btn.done::after{content:"✨";opacity:0;margin-left:2px;animation:sparkle .6s .15s forwards}
@keyframes sparkle{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
.done-info{text-align:center;font-size:13px;color:var(--dim)}
.done-info b{color:var(--gold)}
/* 留言输入 */
.note-box{margin-top:14px;display:none}
.note-box.show{display:block}
.note-box textarea{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--card-bd);
  background:rgba(255,255,255,.06);color:var(--text);padding:10px 12px;font-size:14px;
  font-family:inherit;resize:vertical;outline:none}
.note-box textarea:focus{border-color:var(--heart)}
.note-box textarea::placeholder{color:var(--faint)}
.note-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.q-btn{padding:5px 12px;border-radius:999px;border:1px solid var(--card-bd);background:rgba(255,255,255,.05);
  color:var(--dim);font-size:12px;cursor:pointer;transition:all .2s}
.q-btn:active{transform:scale(.92)}
.q-btn:hover{color:var(--pink);border-color:var(--heart)}
/* 设置任务 */
.set-task{margin-top:16px;text-align:center}
.set-task summary{list-style:none;cursor:pointer;font-size:13px;color:var(--dim);padding:8px}
.set-task summary:hover{color:var(--pink)}
.set-task .set-body{display:flex;gap:8px;margin-top:8px}
.set-task input{flex:1;padding:10px 14px;border-radius:999px;border:1px solid var(--card-bd);
  background:rgba(255,255,255,.06);color:var(--text);font-size:14px;outline:none}
.set-task input:focus{border-color:var(--heart)}
.set-task .who{display:flex;gap:6px;margin-bottom:8px;justify-content:center}
.who-btn{padding:6px 16px;border-radius:999px;border:1px solid var(--card-bd);background:transparent;
  color:var(--dim);font-size:13px;cursor:pointer;transition:all .2s}
.who-btn.on{border-color:var(--heart);color:var(--pink);background:rgba(255,107,157,.12)}
.mini-btn{padding:10px 20px;border-radius:999px;border:none;cursor:pointer;font-size:13px;
  background:linear-gradient(135deg,var(--heart),var(--deep));color:#fff;font-weight:600}
/* 回忆墙 */
.wall{margin-top:28px}
.wall-title{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--pink);cursor:pointer;
  padding:16px 8px;user-select:none;min-height:48px;border-radius:12px;transition:background .2s}
.wall-title:hover{background:rgba(255,200,220,.06)}
.wall-title:active{background:rgba(255,200,220,.12)}
.wall-title .arrow{transition:transform .3s;color:var(--dim);font-size:11px;width:16px}
.wall-title.open .arrow{transform:rotate(90deg)}
.wall-body{display:none;flex-direction:column;gap:8px;max-height:380px;overflow-y:auto;padding:4px 2px}
.wall-body.open{display:flex}
.w-item{background:var(--card);border:1px solid var(--card-bd);border-radius:12px;padding:10px 14px;font-size:13px}
.w-item .w-date{font-size:11px;color:var(--faint);margin-bottom:3px}
.w-item .w-date-full{opacity:.55;font-size:10px;margin-left:6px;letter-spacing:.5px}
.w-item .w-task{color:var(--text);word-break:break-word}
.w-item .w-meta{font-size:11px;color:var(--dim);margin-top:4px}
.w-item.done{border-left:3px solid #7ec9a0}
.w-item.undone{border-left:3px solid var(--faint);opacity:.75}
.w-item .w-note{color:var(--gold);font-style:italic;margin-top:3px}
.w-empty{text-align:center;color:var(--faint);font-size:13px;padding:16px}
/* 双人统计 */
.stats-panel{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.s-card{background:var(--card);border:1px solid var(--card-bd);border-radius:14px;padding:14px;text-align:center}
.s-card .s-name{font-size:13px;color:var(--dim);margin-bottom:6px}
.s-card .s-num{font-size:24px;font-weight:700;color:var(--pink)}
.s-card .s-sub{font-size:11px;color:var(--faint);margin-top:4px}
.s-card.a{border-top:3px solid #ff6b9d}
.s-card.b{border-top:3px solid #6b8bff}
.s-card.b .s-num{color:#9db8ff}
/* ── 正字区块 ── */
.zz-block{margin-top:18px;background:var(--card);border:1px solid var(--card-bd);border-radius:18px;
  padding:16px 16px 14px;backdrop-filter:blur(8px)}
.zz-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.zz-title{font-size:15px;color:var(--pink);font-weight:600;letter-spacing:1px}
.zz-progress{margin-left:auto;font-size:12px;color:var(--dim)}
.zz-cal-btn{background:none;border:none;font-size:16px;cursor:pointer;padding:6px 8px;border-radius:8px;transition:background .2s}
.zz-cal-btn:hover{background:rgba(255,200,220,.12)}
.zz-grid{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.zz-cell{width:56px;height:56px;background:rgba(255,255,255,.04);border:1px solid var(--card-bd);border-radius:10px;
  position:relative;overflow:hidden;transition:border-color .3s}
.zz-cell svg{width:100%;height:100%;display:block}
.zz-cell .stroke{fill:#2d2442;transition:fill .4s,transform .3s;transform-box:fill-box;transform-origin:center}
.zz-cell .stroke.lit{fill:url(#zzGrad)}
.zz-cell .stroke.lit.pop{animation:zzPop .55s cubic-bezier(.34,1.4,.64,1)}
@keyframes zzPop{0%{transform:scale(.82);filter:drop-shadow(0 0 0 rgba(255,126,157,0))}45%{transform:scale(1.07);filter:drop-shadow(0 0 12px rgba(255,126,157,.95))}100%{transform:scale(1);filter:drop-shadow(0 0 5px rgba(255,126,157,.55))}}
.zz-cell.done{border-color:rgba(255,126,157,.55);background:rgba(255,126,157,.08)}
.zz-cell.done::after{content:"✓";position:absolute;right:3px;top:0;font-size:11px;color:var(--heart);opacity:.8}
.zz-hint{text-align:center;font-size:12px;color:var(--dim);margin-top:8px;min-height:18px}
.zz-hint b{color:var(--gold)}
.zz-gifts{display:flex;justify-content:center;gap:14px;margin-top:8px;flex-wrap:wrap}
.zz-gift{font-size:12px;color:var(--dim)}
.zz-gift b{color:var(--pink);font-size:14px;margin-left:2px}
.zz-gift.love b{color:#c9a8ff}
/* ── 日历热力图 ── */
.cal-panel{margin-top:14px;background:var(--card);border:1px solid var(--card-bd);border-radius:16px;
  padding:14px;backdrop-filter:blur(8px)}
.cal-title{font-size:13px;color:var(--pink);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cal-close{margin-left:auto;cursor:pointer;color:var(--dim);font-size:14px;padding:4px 8px;border-radius:6px}
.cal-close:hover{background:rgba(255,200,220,.12)}
.cal-heat{display:flex;gap:3px;width:max-content;overflow-x:auto;max-width:100%;padding-bottom:4px}
.heat-col{display:flex;flex-direction:column;gap:3px}
.heat-cell{width:11px;height:11px;border-radius:2.5px;background:rgba(255,255,255,.05)}
.heat-cell.l1{background:rgba(255,107,157,.25)}
.heat-cell.l2{background:rgba(255,107,157,.45)}
.heat-cell.l3{background:rgba(255,107,157,.7)}
.heat-cell.l4{background:linear-gradient(135deg,#ff6b9d,#c26bff)}
.heat-cell.today{outline:1.5px solid var(--gold);outline-offset:1px}
.cal-note{font-size:10px;color:var(--faint);margin-top:8px}
.heat-legend{display:flex;align-items:center;gap:3px;margin-top:8px}
.heat-legend .heat-cell{width:10px;height:10px}
/* 底部 */
footer{margin-top:30px;text-align:center;font-size:11px;color:var(--faint);letter-spacing:1px}
footer button{background:none;border:none;color:var(--faint);font-size:11px;cursor:pointer;text-decoration:underline;
  padding:10px 14px;min-height:44px;border-radius:999px;transition:color .2s,background .2s}
footer button:hover{color:var(--pink);background:rgba(255,200,220,.08)}
.sync-state{font-size:10px;color:var(--faint);opacity:.75;margin:6px 0 2px;letter-spacing:.5px}
.sync-state.ok{color:var(--gold);opacity:.9}
/* 名字弹窗 */
.mask{position:fixed;inset:0;background:rgba(10,5,25,.7);backdrop-filter:blur(4px);z-index:50;
  display:none;align-items:center;justify-content:center}
.mask.show{display:flex}
.modal{background:linear-gradient(160deg,#241543,#33205c);border:1px solid var(--card-bd);border-radius:18px;
  padding:26px 24px;width:88%;max-width:380px;box-shadow:0 12px 48px rgba(0,0,0,.5)}
.modal h3{text-align:center;color:var(--pink);font-size:17px;margin-bottom:18px}
.modal .fld{margin-bottom:12px}
.modal .fld label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.modal .fld input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--card-bd);
  background:rgba(255,255,255,.06);color:var(--text);font-size:14px;outline:none}
.modal .fld input:focus{border-color:var(--heart)}
.modal .modal-btns{display:flex;gap:10px;margin-top:18px}
.modal .modal-btns button{flex:1;padding:10px;border-radius:999px;border:none;cursor:pointer;font-size:14px;font-weight:600}
.modal .ok{background:linear-gradient(135deg,var(--heart),var(--deep));color:#fff}
.modal .cancel{background:rgba(255,255,255,.1);color:var(--dim)}
/* 爱心粒子动画 */
.heart-burst{position:fixed;z-index:99;pointer-events:none;font-size:24px;animation:floatUp 1.6s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.6) rotate(0)}100%{opacity:0;transform:translateY(-140px) scale(1.3) rotate(20deg)}}
/* 全屏庆祝 */
.celebrate{position:fixed;inset:0;z-index:98;pointer-events:none;display:none}
.celebrate.show{display:block}
.celebrate .cx{position:absolute;font-size:26px;animation:cFall 2.6s ease-in forwards}
@keyframes cFall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:.7}}
/* 补签提示 */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:60;
  background:rgba(36,21,67,.95);border:1px solid var(--heart);color:var(--pink);
  padding:10px 22px;border-radius:999px;font-size:13px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.show{display:block;animation:toastIn 3s forwards}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-10px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
@media (max-width:400px){.task-text{font-size:18px}.check-btn{padding:13px 34px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="moon"></div>

<div class="wrap">
  <header>
    <div class="couple">
      <div class="head head-a" id="headA">🌸</div>
      <span class="heart-mini">💗</span>
      <div class="head head-b" id="headB">🌙</div>
    </div>
  </header>
  <div class="names">
    <span class="n"><b id="nameA">宝宝</b><span class="amp">♥</span><b id="nameB">宝贝</b></span>
  </div>
  <div class="subtitle">· 我们的每日约定 ·</div>

  <div class="streak-row">
    <span class="streak-badge"><span class="fire">🔥</span> 连续 <b id="streakNum">0</b> 天</span>
  </div>

  <div class="day-label">— 今日约定 · <span id="todayDate"></span> —</div>
  <div class="task-card" id="taskCard">
    <div class="tape"></div>
    <div class="task-date" id="taskDate"></div>
    <div class="task-text" id="taskText">今天还没有约定 ✨</div>
    <div class="setter-line" id="setterLine"></div>

    <div class="check-zone">
      <button class="check-btn" id="checkBtn">💗 一起完成</button>
      <div class="done-info" id="doneInfo" style="display:none"></div>
      <div class="note-box" id="noteBox">
        <textarea id="noteInput" placeholder="留一句话给 TA…（可选）"></textarea>
        <div class="note-quick" id="noteQuick">
          <button class="q-btn">想你啦 💕</button>
          <button class="q-btn">超棒的！🌟</button>
          <button class="q-btn">明天见 🌙</button>
          <button class="q-btn">我爱你 ❤️</button>
        </div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="mini-btn" id="noteToggle" style="display:none">💌 留言</button>
        <button class="mini-btn" id="uncheckBtn" style="display:none;background:rgba(255,255,255,.15)">↩️ 取消</button>
      </div>
    </div>

    <details class="set-task" id="setTask">
      <summary id="setTaskSummary">✏️ 我来定明天的约定…（今天已完成则设明天）</summary>
      <div class="set-body">
        <div style="flex:1;display:flex;flex-direction:column;gap:8px">
          <div class="who">
            <button class="who-btn on" data-who="a" id="whoA">🌸 我</button>
            <button class="who-btn" data-who="b" id="whoB">🌙 我</button>
          </div>
          <input id="taskInput" maxlength="100" placeholder="写下一个想一起做的事…">
        </div>
        <button class="mini-btn" id="taskSave">定下</button>
      </div>
    </details>
  </div>

  <div class="stats-panel">
    <div class="s-card a">
      <div class="s-name" id="statNameA">🌸 宝宝</div>
      <div class="s-num" id="statDoneA">0</div>
      <div class="s-sub" id="statSubA">完成 · 设了 0 个</div>
    </div>
    <div class="s-card b">
      <div class="s-name" id="statNameB">🌙 宝贝</div>
      <div class="s-num" id="statDoneB">0</div>
      <div class="s-sub" id="statSubB">完成 · 设了 0 个</div>
    </div>
  </div>

  <!-- 正字区块: 共同攒画 → 正字 → 礼物 -->
  <div class="zz-block">
    <div class="zz-head">
      <span class="zz-title">🤍 我们的正字</span>
      <span class="zz-progress" id="zzProgress">0 / 25 画</span>
      <button class="zz-cal-btn" id="calBtn" title="完成日历">📅</button>
    </div>
    <div class="zz-grid" id="zzGrid"></div>
    <div class="zz-hint" id="zzHint">起点！攒出第一个「正」字吧 💕</div>
    <div class="zz-gifts">
      <span class="zz-gift">🎁 小惊喜 <b id="zzSmall">0</b></span>
      <span class="zz-gift">🎉 大惊喜 <b id="zzBig">0</b></span>
      <span class="zz-gift love">🤍 爱 <b id="zzLove">0</b></span>
    </div>
  </div>

  <!-- 日历热力图面板 -->
  <div class="cal-panel" id="calPanel" style="display:none">
    <div class="cal-title">📅 完成日历 <span class="cal-close" id="calClose">✕</span></div>
    <div class="cal-heat" id="calHeat"></div>
    <div class="cal-note">最近 17 周 · 完成约定的日子</div>
  </div>

  <div class="wall">

<script>
// ── 工具 ──
const $ = id => document.getElementById(id);
const state = {today:null, names:{a:'宝宝',b:'宝贝'}, me:'a', streak:0, usedRedos:[]};

// ── 数据层: GitHub Contents API 模式 (私有仓库 data.json 双端同步) ──
// 与 server.py 模式共用同一数据文件结构; 无 token 时降级 localStorage(独立模式)
const GITHUB = {
  owner: 'Mchsd',
  repo: 'couple-tasks',
  path: 'data.json',
  token: localStorage.getItem('couple_token') || '',  // 由用户在设置页填入, 存 localStorage
};
let _ghSha = null;         // data.json 当前版本 sha (乐观锁)
let _ghCache = null;       // 内存缓存 (避免每次读 API)
let _localMode = false;    // true = localStorage 独立模式

function defaultData(){
  return {
    names: {a:'宝宝', b:'宝贝'},
    days: {},
    used_redos: [],
    zhengzi: {count:0, gifts_small:0, gifts_big:0, love_marks:0},
    created_at: new Date().toISOString().slice(0,19),
  };
}

function localKey(){ return 'couple_tasks_local'; }
function loadLocal(){
  try { return JSON.parse(localStorage.getItem(localKey()) || 'null') || defaultData(); }
  catch(e){ return defaultData(); }
}
function saveLocal(data){
  localStorage.setItem(localKey(), JSON.stringify(data));
  localStorage.setItem('couple_token', GITHUB.token);
}

function ghApi(method, suffix, body){
  const opt = {method, headers:{'Accept':'application/vnd.github+json'}};
  if(GITHUB.token) opt.headers['Authorization'] = 'Bearer ' + GITHUB.token;
  if(body){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  return fetch(`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}${suffix}`, opt)
    .then(r => r.json().then(j => ({status:r.status, json:j})));
}

// 读取 data.json: 优先 GitHub, 404 则初始化; 失败降级 localStorage
async function loadData(){
  if(_ghCache) return _ghCache;
  try{
    const r = await ghApi('GET', '/contents/' + GITHUB.path);
    if(r.status === 200 && r.json.encoding === 'base64'){
      _ghSha = r.json.sha;
      // 正确解码: base64 → 字节 → UTF-8 文本 (atob 直接 JSON.parse 会把中文乱码)
      const bytes = Uint8Array.from(atob(r.json.content.replace(/\n/g,'')), c => c.charCodeAt(0));
      const text = new TextDecoder('utf-8').decode(bytes);
      _ghCache = JSON.parse(text);
      _localMode = false;
      return _ghCache;
    }
    if(r.status === 404){
      // GitHub 对"私有仓库无权访问"也返回 404(隐藏存在性)。
      // 无 token 时无法区分"真不存在"vs"无权限" → 直接降级本地, 绝不覆盖 localStorage
      if(!GITHUB.token){ throw new Error('no token (private repo hides as 404)'); }
      // 有 token 且真不存在: 首次使用, 初始化 data.json 到 GitHub
      _ghCache = defaultData();
      _ghSha = null;
      await saveData(_ghCache, true);
      _localMode = false;
      return _ghCache;
    }
    throw new Error('GitHub API ' + r.status);
  }catch(e){
    // 无网络/token 无效 → localStorage 独立模式
    _ghCache = loadLocal();
    _localMode = true;
    return _ghCache;
  }
}

// 写回 data.json (带 sha 乐观锁, 冲突重试一次)
async function saveData(data, force=false){
  _ghCache = data;
  if(_localMode || !GITHUB.token){ saveLocal(data); return {ok:true, local:true}; }
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const payload = {message:'update data', content};
  if(_ghSha) payload.sha = _ghSha;
  let r = await ghApi('PUT', '/contents/' + GITHUB.path, payload);
  if(r.status === 409 && !force){  // sha 冲突: 重新读最新再写
    const fresh = await loadData();
    payload.sha = _ghSha;
    r = await ghApi('PUT', '/contents/' + GITHUB.path, payload);
  }
  if(r.status === 200 || r.status === 201){
    _ghSha = r.json.content.sha;
    return {ok:true};
  }
  throw new Error('GitHub 写入失败 ' + r.status + ' ' + JSON.stringify(r.json).slice(0,200));
}

// ── 业务计算 (从 server.py 移植) ──
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getStreak(data){
  const days = data.days || {};
  let streak = 0;
  let d = new Date();
  const tStr = todayStr();
  if(!(days[tStr] || {}).done){
    d = new Date(d.getTime() - 86400000);
  }
  while(true){
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const entry = days[ds];
    if(entry && entry.done){ streak++; d = new Date(d.getTime() - 86400000); }
    else break;
  }
  return streak;
}
function getStats(data){
  const days = data.days || {};
  const s = {a:{set:0,done:0}, b:{set:0,done:0}};
  for(const entry of Object.values(days)){
    if(entry.setter === 'a') s.a.set++;
    else if(entry.setter === 'b') s.b.set++;
    if(entry.done){
      if(entry.done_by === 'a') s.a.done++;
      else if(entry.done_by === 'b') s.b.done++;
    }
  }
  return s;
}
function getHistory(data, limit=90){
  const days = data.days || {};
  return Object.keys(days).sort().reverse().slice(0, limit).map(ds => {
    const e = days[ds];
    return {date:ds, task:e.task||'', setter:e.setter, done:!!e.done,
      done_by:e.done_by, note:e.note||'', done_at:e.done_at};
  });
}
function buildState(data){
  const ds = todayStr();
  const t = (data.days || {})[ds] || {};
  // 兼容旧数据: 无 zhengzi 字段时初始化
  const zz = data.zhengzi || (data.zhengzi = {count:0, gifts_small:0, gifts_big:0, love_marks:0});
  return {
    today: {task:t.task||null, setter:t.setter, done:!!t.done, done_by:t.done_by,
      note:t.note||'', done_at:t.done_at},
    date: ds,
    streak: getStreak(data),
    used_redos: data.used_redos || [],
    names: data.names || {a:'宝宝',b:'宝贝'},
    stats: getStats(data),
    history: getHistory(data),
    zhengzi: zz,
    total_days: Object.values(data.days||{}).filter(e=>e.task).length,
    created_at: data.created_at,
    local_mode: _localMode,
  };
}

// ── api 兼容层: 本地 server 模式走 fetch, GitHub 模式走上述逻辑 ──
async function api(path, method='GET', body=null){
  if(path.startsWith('/api/')){
    // 尝试本地 server (开发模式); 失败则用 GitHub 数据
    if(!window.location.protocol.startsWith('file') && location.hostname !== '' && !location.hostname.includes('github.io')){
      try{
        const opt = {method, headers:{}};
        if(body){opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body);}
        const r = await fetch(path, opt);
        if(r.ok) return await r.json();
      }catch(e){ /* 落到 GitHub 模式 */ }
    }
    const data = await loadData();
    if(method === 'GET') return buildState(data);
    if(path === '/api/task'){
      const task = String(body.task||'').trim().slice(0,100);
      if(!task) return {error:'任务不能为空'};
      const ds = todayStr();
      data.days = data.days || {};
      data.days[ds] = data.days[ds] || {};
      data.days[ds].task = task;
      data.days[ds].setter = body.setter === 'b' ? 'b' : 'a';
      data.days[ds].done = !!data.days[ds].done;
      await saveData(data);
      return buildState(data);
    }
    if(path === '/api/check'){
      const ds = todayStr();
      data.days = data.days || {};
      const entry = data.days[ds] = data.days[ds] || {};
      if(!entry.task) return {error:'今天还没有任务, 先设置一个吧'};
      if(entry.done) return {error:'今天已经完成啦'};
      entry.done = true;
      entry.done_by = body.done_by === 'b' ? 'b' : 'a';
      const now = new Date();
      entry.done_at = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
      entry.note = String(body.note||'').trim().slice(0,200);
      // 正字联动: 完成约定 → 攒一画; 5画=小惊喜, 25画=大惊喜+爱字
      const zz = data.zhengzi || (data.zhengzi = {count:0, gifts_small:0, gifts_big:0, love_marks:0});
      zz.count = (zz.count || 0) + 1;
      let milestone = null;
      if(zz.count % 5 === 0){ zz.gifts_small = (zz.gifts_small||0) + 1; milestone = 'small'; }
      if(zz.count % 25 === 0){ zz.gifts_big = (zz.gifts_big||0) + 1; zz.love_marks = (zz.love_marks||0) + 1; milestone = 'big'; }
      zz.last_milestone = milestone;
      await saveData(data);
      return buildState(data);
    }
    if(path === '/api/uncheck'){
      const ds = todayStr();
      const entry = (data.days || {})[ds];
      if(entry && entry.done){
        entry.done = false; entry.done_by = null; entry.done_at = null; entry.note = '';
        // 正字联动: 取消完成 → 扣回一画 (不扣已得礼物)
        const zz = data.zhengzi;
        if(zz && zz.count > 0) zz.count -= 1;
        await saveData(data);
      }
      return buildState(data);
    }
    if(path === '/api/names'){
      const na = String(body.name_a||'').trim().slice(0,20);
      const nb = String(body.name_b||'').trim().slice(0,20);
      if(!na || !nb) return {error:'两个名字都不能为空'};
      data.names = data.names || {};
      data.names.a = na; data.names.b = nb;
      await saveData(data);
      return buildState(data);
    }
    if(path === '/api/reset'){
      const fresh = defaultData();
      fresh.names = data.names;  // 保留名字
      await saveData(fresh, true);
      return buildState(fresh);
    }
  }
  const opt = {method, headers:{}};
  if(body){opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body);}
  return fetch(path, opt).then(r=>r.json());
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}
function fmtDate(iso){ // 2026-08-16 → 8月16日
  const [y,m,d] = iso.split('-').map(Number);
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  if(iso === todayStr) return '今天';  // 字符串比较, 避免时分秒导致的 round 误差
  const that = new Date(y, m-1, d);
  const diff = Math.round((new Date(todayStr) - that)/86400000);  // 零点差值=整数天
  if(diff===1) return '昨天';
  if(diff>1 && diff<=7) return `${diff}天前`;
  return `${m}月${d}日`;
}
function renderStars(){
  const s = $('stars');
  for(let i=0;i<60;i++){
    const st = document.createElement('div');
    st.className='star';
    const sz = Math.random()*2.5+1;
    st.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s`;
    s.appendChild(st);
  }
}
// ── 心形爆裂 ──
function heartBurst(x,y){
  const emojis = ['💗','💖','💕','💘','✨','🌸'];
  for(let i=0;i<10;i++){
    const h = document.createElement('div');
    h.className='heart-burst';
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left = (x + (Math.random()*120-60)) + 'px';
    h.style.top = (y + (Math.random()*60-30)) + 'px';
    h.style.animationDelay = (Math.random()*0.3) + 's';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(), 2000);
  }
}
// ── 全屏心形烟花(成就) ──
function celebrate(){
  const c = $('celebrate'); c.classList.add('show');
  const emojis = ['💖','💘','💝','🌹','💞','💕','✨'];
  for(let i=0;i<36;i++){
    const x = document.createElement('div');
    x.className='cx';
    x.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    x.style.left = (Math.random()*100) + 'vw';
    x.style.animationDelay = (Math.random()*1.2) + 's';
    x.style.fontSize = (18+Math.random()*22) + 'px';
    c.appendChild(x);
  }
  setTimeout(()=>{c.classList.remove('show'); c.innerHTML='';}, 3200);
}
// ── 渲染 ──
function render(s, opts){
  opts = opts || {};
  state.today = s.today; state.names = s.names; state.streak = s.streak;
  state.zhengzi = s.zhengzi;
  state.history = s.history;
  $('nameA').textContent = s.names.a;
  $('nameB').textContent = s.names.b;
  $('statNameA').textContent = '🌸 ' + s.names.a;
  $('statNameB').textContent = '🌙 ' + s.names.b;
  $('headA').textContent = '🌸'; $('headB').textContent = '🌙';
  $('todayDate').textContent = fmtDate(s.date);
  $('streakNum').textContent = s.streak;
  $('taskDate').textContent = fmtDate(s.date) === '今天'
    ? '📅 ' + s.date
    : fmtDate(s.date);
  // 同步模式指示
  const syncEl = $('syncState');
  if(s.local_mode || _localMode){
    syncEl.textContent = '💾 本机独立模式（未同步）';
    syncEl.classList.remove('ok');
  } else if(GITHUB.token){
    syncEl.textContent = '☁️ 已云端同步';
    syncEl.classList.add('ok');
  } else {
    syncEl.textContent = '☁️ 云端同步未开启 · 点设置填入令牌';
    syncEl.classList.remove('ok');
  }

  const t = s.today;
  const card = $('taskCard'); const btn = $('checkBtn');
  if(t.task){
    $('taskText').textContent = t.task;
    $('taskText').classList.remove('empty');
    $('setterLine').innerHTML = t.setter
      ? `<span class="heart-s">❤</span> ${s.names[t.setter]} 定的约定`
      : '';
    card.classList.toggle('done', !!t.done);
    if(t.done){
      btn.textContent = '✅ 完成啦'; btn.classList.add('done'); btn.disabled = true;
      $('doneInfo').style.display = 'block';
      $('doneInfo').innerHTML = `<b>${s.names[t.done_by]}</b> 完成了它 ${t.done_at ? '· '+t.done_at : ''}` +
        (t.note ? `<br>💌 "${t.note}"` : '');
      $('uncheckBtn').style.display = 'inline-block';
      $('setTask').style.display = 'none';
    } else {
      btn.textContent = '💗 一起完成'; btn.classList.remove('done'); btn.disabled = false;
      $('doneInfo').style.display = 'none';
      $('uncheckBtn').style.display = 'none';
      $('noteToggle').style.display = 'inline-block';
    }
  } else {
    $('taskText').textContent = '今天还没有约定 ✨'; $('taskText').classList.add('empty');
    $('setterLine').textContent = '';
    card.classList.remove('done');
    btn.textContent = '💗 一起完成'; btn.classList.remove('done'); btn.disabled = true;
    $('doneInfo').style.display = 'none';
    $('uncheckBtn').style.display = 'none';
    $('noteToggle').style.display = 'none';
  }
  $('setTaskSummary').textContent = t.task
    ? '✏️ 改今天的约定…'
    : '✏️ 写下今天的约定…';

  // 统计
  $('statDoneA').textContent = s.stats.a.done;
  $('statDoneB').textContent = s.stats.b.done;
  $('statSubA').textContent = `完成 ${s.stats.a.done} · 设了 ${s.stats.a.set} 个`;
  $('statSubB').textContent = `完成 ${s.stats.b.done} · 设了 ${s.stats.b.set} 个`;

  // 正字区块
  renderZhengzi(s.zhengzi || {count:0, gifts_small:0, gifts_big:0, love_marks:0}, s.history, opts.animateZZ);

  // 回忆墙
  $('wallCount').textContent = `(${s.history.length})`;
  const wall = $('wallBody');
  if(s.history.length === 0){
    wall.innerHTML = '<div class="w-empty">还没有回忆，从今天开始吧 🌙</div>';
  } else {
    wall.innerHTML = s.history.map(h => `
      <div class="w-item ${h.done?'done':'undone'}">
        <div class="w-date">${fmtDate(h.date)}${h.done?' ✅':' ⏳'}<span class="w-date-full">${h.date}</span></div>
        <div class="w-task">${escapeHtml(h.task||'(未设置)')}</div>
        <div class="w-meta">${h.setter?`${s.names[h.setter]} 定的`:'—'}${h.done?` · ${s.names[h.done_by]} 完成`:''}</div>
        ${h.note?`<div class="w-note">💌 ${escapeHtml(h.note)}</div>`:''}
      </div>`).join('');
  }
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ════════ 正字系统 (情侣版: 完成约定攒一画, 5画=正字=小惊喜, 25画=大惊喜+爱) ════════
// hanzi-writer 数据: y-up 坐标系(原点左下), strokes 数组即标准书写顺序
// 「正」: 1顶横(短) 2中竖 3中横 4左竖 5底横(长) → 上小下大
const ZZ_STROKES = [
  'M 505 667 Q 590 683 683 699 Q 744 712 754 720 Q 764 729 759 738 Q 752 751 719 761 Q 686 768 574 734 Q 421 701 321 693 Q 279 689 308 668 Q 354 641 431 655 Q 444 658 460 659 L 505 667 Z',
  'M 534 154 Q 537 298 539 420 L 540 457 Q 543 634 544 635 Q 543 638 542 638 Q 523 657 505 667 C 480 683 449 687 460 659 Q 484 596 485 591 Q 485 231 484 149 C 484 119 533 124 534 154 Z',
  'M 539 420 Q 578 411 616 422 Q 757 452 767 457 Q 777 466 772 475 Q 763 488 732 495 Q 699 501 667 487 Q 636 477 603 468 Q 573 462 540 457 C 510 452 510 426 539 420 Z',
  'M 346 135 Q 322 345 327 402 Q 328 427 312 441 Q 285 459 254 468 Q 238 472 228 465 Q 221 458 228 441 Q 253 399 266 354 Q 276 309 300 131 C 304 101 349 105 346 135 Z',
  'M 300 131 Q 203 124 100 114 Q 75 113 93 91 Q 109 73 131 66 Q 156 59 176 64 Q 467 131 884 110 Q 885 111 888 110 Q 912 109 918 119 Q 925 134 906 151 Q 839 203 784 190 Q 687 174 534 154 L 484 149 Q 417 143 346 135 L 300 131 Z',
];
let _zzBuilt = false;
function buildZhengziGrid(){
  if(_zzBuilt) return;
  const grid = $('zzGrid');
  for(let i=0;i<5;i++){
    const cell = document.createElement('div');
    cell.className = 'zz-cell';
    cell.id = 'zzc'+i;
    // y-up → y-down 翻转, 否则正字上下颠倒
    let svg = `<svg viewBox="0 0 1024 1024"><g transform="translate(0,1024) scale(1,-1)">`;
    ZZ_STROKES.forEach((d,k)=>{ svg += `<path class="stroke" id="zzs${i}_${k}" d="${d}"/>`; });
    svg += `</g></svg>`;
    cell.innerHTML = svg;
    grid.appendChild(cell);
  }
  _zzBuilt = true;
}
function renderZhengzi(zz, history, animateFrom){
  buildZhengziGrid();
  const count = zz.count || 0;
  $('zzProgress').textContent = `${count} / 25 画`;
  $('zzSmall').textContent = zz.gifts_small || 0;
  $('zzBig').textContent = zz.gifts_big || 0;
  $('zzLove').textContent = zz.love_marks || 0;
  for(let i=0;i<5;i++){
    const cell = $('zzc'+i);
    if(!cell) continue;
    const lit = Math.max(0, Math.min(5, count - i*5));
    cell.classList.toggle('done', lit >= 5);
    for(let k=0;k<5;k++){
      const s = $('zzs'+i+'_'+k);
      if(!s) continue;
      const nowLit = k < lit;
      const wasLit = s.classList.contains('lit');
      if(animateFrom && nowLit && !wasLit){
        const delay = (i*5 + k) * 80;
        setTimeout(()=>{
          s.classList.add('lit'); s.classList.remove('pop');
          try{ void s.getBBox(); }catch(e){}
          s.classList.add('pop');
          setTimeout(()=>s.classList.remove('pop'), 520);
        }, delay);
      } else {
        s.classList.toggle('lit', nowLit);
      }
    }
  }
  // 提示
  const needSmall = 5 - (count % 5);
  const needBig = 25 - (count % 25);
  const hint = $('zzHint');
  if(count === 0) hint.innerHTML = '起点！攒出第一个「正」字吧 💕';
  else if(count >= 25) hint.innerHTML = `攒满 5 个正字啦！新的一轮开始 🎉`;
  else hint.innerHTML = `距小惊喜还差 <b>${needSmall}</b> 画 · 距大惊喜还差 <b>${needBig}</b> 画`;
}

// ════════ 日历热力图 (GitHub 风格, 完成记录) ════════
function lkey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function renderHeatmap(history){
  const daily = {};
  history.forEach(h => { if(h.done) daily[h.date] = (daily[h.date]||0) + 1; });
  const weeks = 17;   // 最近17周(约4个月)
  const today = new Date();
  const start = new Date(today);
  start.setDate(start.getDate() - (weeks*7 - 1));
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));  // 对齐周一
  const todayKey = lkey(today);
  const colCount = Math.ceil((today - start) / 86400000 / 7);
  const html = [];
  for(let w=0; w<colCount; w++){
    let col = '<div class="heat-col">';
    for(let r=0; r<7; r++){
      const dt = new Date(start); dt.setDate(start.getDate() + w*7 + r);
      const k = lkey(dt);
      const n = daily[k] || 0;
      const lv = (k > todayKey) ? '' : (n<=0 ? 0 : n===1 ? 1 : n===2 ? 2 : n===3 ? 3 : 4);
      col += `<div class="heat-cell${lv ? ' l'+lv : ''}${k === todayKey ? ' today' : ''}" title="${k}：${n} 次完成"></div>`;
    }
    col += '</div>';
    html.push(col);
  }
  $('calHeat').innerHTML = html.join('');
  // 图例
  const legend = document.createElement('div');
  legend.className = 'heat-legend';
  legend.innerHTML = '<span style="color:var(--faint);font-size:10px;margin-right:5px">少</span>'
    + [0,1,2,3,4].map(l=>`<span class="heat-cell${l ? ' l'+l : ''}"></span>`).join('')
    + '<span style="color:var(--faint);font-size:10px;margin-left:5px">多</span>';
  const old = document.querySelector('.heat-legend');
  if(old) old.remove();
  $('calHeat').insertAdjacentElement('afterend', legend);
}

// ════════ 庆祝 (彩带/烟花/爱字) ════════
function zzCelebrate(kind){
  const c = $('celebrate');
  if(kind === 'small'){
    // 小惊喜: 彩带雨
    c.classList.add('show');
    const emojis = ['🎁','💝','🎀','✨','🌸','💕'];
    for(let i=0;i<24;i++){
      const x = document.createElement('div');
      x.className = 'cx';
      x.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      x.style.left = (Math.random()*100) + 'vw';
      x.style.animationDelay = (Math.random()*0.8) + 's';
      x.style.fontSize = (16+Math.random()*18) + 'px';
      c.appendChild(x);
    }
    setTimeout(()=>{ c.classList.remove('show'); c.innerHTML=''; }, 3000);
    setTimeout(()=>toast('🎁 攒满一个正字！小惊喜到手～'), 600);
  } else if(kind === 'big'){
    // 大惊喜: 烟花 + 爱字
    c.classList.add('show');
    const emojis = ['🎉','💖','❤️','🌹','🎆','💘','✨'];
    for(let i=0;i<44;i++){
      const x = document.createElement('div');
      x.className = 'cx';
      x.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      x.style.left = (Math.random()*100) + 'vw';
      x.style.animationDelay = (Math.random()*1.4) + 's';
      x.style.fontSize = (20+Math.random()*26) + 'px';
      c.appendChild(x);
    }
    setTimeout(()=>{ c.classList.remove('show'); c.innerHTML=''; }, 3500);
    setTimeout(()=>toast('🎉 五个正字！一个大惊喜 + 🤍 爱 +1'), 700);
  }
}

$('checkBtn').addEventListener('click', async e => {
  const btn = $('checkBtn');
  const r = btn.getBoundingClientRect();
  heartBurst(r.left + r.width/2, r.top);
  const doneBy = state.me;
  const note = $('noteInput').value.trim();
  const res = await api('/api/check', 'POST', {done_by: doneBy, note});
  if(res.error){ toast(res.error); return; }
  const prev = state.streak;
  const prevZZ = state.zhengzi ? state.zhengzi.count : 0;
  render(res, {animateZZ: true});
  // 正字里程碑庆祝
  const zz = res.zhengzi || {};
  if(zz.last_milestone === 'big') zzCelebrate('big');
  else if(zz.last_milestone === 'small') zzCelebrate('small');
  if(res.streak > prev && res.streak > 0 && (res.streak === 7 || res.streak === 30 || res.streak === 100)){
    celebrate();
    const msgs = {7:'🎉 连续 7 天！爱是日复一日的选择',30:'💍 连续一个月！把约定过成了习惯',100:'👑 100 天！这就是长久的模样'};
    setTimeout(()=>toast(msgs[res.streak]||''), 500);
  }
  $('noteInput').value = '';
  $('noteBox').classList.remove('show');
});

  const na = $('nameInputA').value.trim(), nb = $('nameInputB').value.trim();
  if(!na || !nb){ toast('两个名字都要填哦'); return; }
  // 保存 token (若填写) — 提前保存以便后续写操作走 GitHub
  const tk = $('tokenInput').value.trim();
  if(tk && tk !== GITHUB.token){
    GITHUB.token = tk;
    localStorage.setItem('couple_token', tk);
    _ghCache = null; _ghSha = null; _localMode = false;  // 重置缓存走 GitHub
  }
  const res = await api('/api/names', 'POST', {name_a: na, name_b: nb});
  if(res.error){ toast(res.error); return; }
  render(res); $('nameMask').classList.remove('show');

});
